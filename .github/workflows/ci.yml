name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify.sh docs
      # Agent progress files are scaffolding for an unfinished job; a pull request
      # that is ready for review must not carry them (drafts may).
      - name: No agent progress files in a ready pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: python3 -I scripts/check_agent_progress.py --none

  backend:
    runs-on: ubuntu-24.04
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/test-results/backend-junit.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r server/requirements.txt -r server/requirements-test.txt
      - run: scripts/verify.sh backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=../test-results/frontend-junit.xml
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm run lint
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn
