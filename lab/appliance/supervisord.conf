[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:nagios

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:apache2]
command=/bin/sh -c ". /etc/apache2/envvars && exec apache2 -D FOREGROUND"
autorestart=true
priority=10

[program:nagios]
command=/usr/local/nagios/bin/nagios /usr/local/nagios/etc/nagios.cfg
user=nagios
autorestart=true
priority=20

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=25

[program:gunicorn]
command=/bin/sh -c "set -a; . /etc/pinpoint/pinpoint.env; set +a; exec /opt/pinpoint/venv/bin/gunicorn --workers 1 --threads 4 --bind 127.0.0.1:8000 --access-logfile - app:app"
directory=/opt/pinpoint/Network-Diagnosis-System/server
user=pinpoint
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
