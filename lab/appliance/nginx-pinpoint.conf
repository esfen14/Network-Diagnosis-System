# Same shape as the installer: Nginx on :80 in front of Gunicorn on loopback.
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        default_type text/plain;
        return 200 "Pinpoint lab appliance. Run the UI with: scripts/lab ui\n";
    }
}
